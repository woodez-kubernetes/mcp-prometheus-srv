apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-prometheus-srv
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/woodez-kubernetes/mcp-prometheus-srv.git
    targetRevision: release-dev
    path: helm


    helm:
      releaseName: mcp-prometheus-srv

      valueFiles:
        - values.yaml
      
      values: |
        image:
          respository: kwood475/mcp-prometheus-srv
          # tag is controlled by values.yaml (updated by CI/CD workflow)
       
        namespace: woodez-database

  destination:
    server: https://kubernetes.default.svc
    namespace: woodez-database

  syncPolicy:
    # test
    # automated:
    #  prune: true
    #  selfHeal: true
    #  allowEmpty: false

    syncOptions:
      # Create namespace if it doesn't exist
      - CreateNamespace=true
      # Respect ignore differences
      - RespectIgnoreDifferences=true
      # Server-side apply
      - ServerSideApply=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
replicaCount: 1

image:
  repository: kwood475/mcp-prometheus-srv
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: mcp-monitor.apexkube.xyz

env:
  DJANGO_SECRET_KEY: "change-me-in-production"
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "*"
  PROMETHEUS_URL: "http://prometheus-server.monitoring.svc.cluster.local:80"
  DB_NAME: "mcp_prometheus"
  DB_USER: "mcp_prometheus"
  DB_PASSWORD: "mcp_prometheus"
  DB_HOST: "postgres-svc"
  DB_PORT: "5432"
